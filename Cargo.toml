[package]
name = "rrsreadline"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Cross-platform shell history suggestions"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
pretty_assertions = "1"

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31.3", features = ["poll", "process", "signal", "term"] }
