name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unix:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install shell dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh

      - name: Install modern Bash on macOS
        if: runner.os == 'macOS'
        run: |
          brew install bash
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Show shell versions
        run: |
          bash --version | head -1
          zsh --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Validate installer script
        run: sh -n scripts/install.sh

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets -- --test-threads=1

      - name: Validate generated shell scripts
        run: |
          cargo build --release
          ./target/release/rrsreadline init bash | bash -n
          ./target/release/rrsreadline init zsh | zsh -n
